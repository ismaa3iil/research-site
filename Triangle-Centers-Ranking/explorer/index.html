<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triangle Center Rankings Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Explore triangle-center rankings, compare 40 measures, inspect diagrams and correlations, and browse 82 physical experiments.">

<style>
/* Layout: a working instrument; a sticky header with view tabs and the ranking range, one view at a time below. */
:root {
  --paper: #f6f7f4; --panel: #ffffff; --ink: #1b2328; --muted: #5d6870; --rule: #d9ddd6;
  --accent: #0e6b6f; --accent-soft: #dcefee; --warm: #a85a14; --warm-soft: #f6e8d8;
  --pos: #1f6f8b; --neg: #b4472f; --hi: #fff3c4;
  --f-display: "Literata", Georgia, serif; --f-body: "IBM Plex Sans", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  --thumb-filter: none;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #13181b; --panel: #1b2226; --ink: #e5eae8; --muted: #9aa6ab; --rule: #2f383c;
  --accent: #5cc4c6; --accent-soft: #1d3b3d; --warm: #e3a061; --warm-soft: #3a2b1d; --pos: #6db7d4; --neg: #e2826b; --hi: #3d3720;
  --thumb-filter: invert(0.92) hue-rotate(180deg); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #13181b; --panel: #1b2226; --ink: #e5eae8; --muted: #9aa6ab; --rule: #2f383c;
  --accent: #5cc4c6; --accent-soft: #1d3b3d; --warm: #e3a061; --warm-soft: #3a2b1d; --pos: #6db7d4; --neg: #e2826b; --hi: #3d3720;
  --thumb-filter: invert(0.92) hue-rotate(180deg); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1240px; margin: 0 auto }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--rule) }
header .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px }
.brand { font-family: var(--f-display); font-weight: 650; font-size: 1.15rem; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px }
.brand small { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); font-weight: 400 }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px }
nav.tabs a { padding: 6px 11px; border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: .92rem }
nav.tabs a:hover { background: var(--accent-soft) }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--panel) }
.range { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted) }
select, input, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px }
button { cursor: pointer } button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
main { padding-block: 22px 60px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; letter-spacing: -0.01em; margin: 0 }
h1 { font-size: 1.7rem } h2 { font-size: 1.3rem } h3 { font-size: 1.05rem }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0 }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted) }
.grid2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; margin-top: 18px }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px }
.def h3 { margin-bottom: 4px } .def p { margin: 8px 0 0; font-size: .92rem } .def .k { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
.pill { display: inline-block; font-family: var(--f-mono); font-size: .74rem; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent) }
.pill.warm { background: var(--warm-soft); color: var(--warm) }
.tablebox { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel) }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; white-space: nowrap }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--panel); position: sticky; top: 0; cursor: pointer }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-size: .86rem }
td.name { white-space: normal; min-width: 180px; max-width: 360px; font-size: .86rem; color: var(--muted) }
a.cx { color: var(--accent); font-family: var(--f-mono); font-weight: 500; text-decoration: none } a.cx:hover { text-decoration: underline }
.thumb { width: 60px; height: 52px; background-repeat: no-repeat; background-size: 600px 520px; border-radius: 4px; border: 1px solid var(--rule); filter: var(--thumb-filter); background-color: #fff }
.thumb { position: relative }
.path-label { position:absolute; bottom:0; left:0; font:9px/1.3 sans-serif; background:#fff; color:#222; padding:0 2px }
.thumb.big { width: 180px; height: 156px; background-size: 1800px 1560px }
.thumb.none { text-align: center; line-height: 1.12; overflow-wrap: anywhere; display: grid; place-items: center; font-size: .65rem; color: var(--muted); filter: none; background: var(--paper) }
.muted { color: var(--muted) } .small { font-size: .82rem }
.heat td { text-align: center; font-family: var(--f-mono); font-size: .82rem }
.heat td.lab, .heat th { text-align: left; white-space: nowrap }
.chips { display: flex; flex-wrap: wrap; gap: 6px } .chips label { display: flex; gap: 5px; align-items: center; font-size: .84rem; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 99px; background: var(--panel); cursor: pointer }
.phys-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; margin-top: 14px }
.phys-card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.phys-card h3 { font-size: 1rem } .phys-card p { margin: 0; font-size: .9rem } .phys-card .num { font-family: var(--f-mono); font-size: .8rem; background: var(--paper); border-radius: 6px; padding: 7px 9px }
.phys-svg { width: 100%; height: auto; background: var(--paper); border-radius: 8px }
.phys-svg .tri { fill: none; stroke: var(--ink); stroke-width: 1.6 } .phys-svg .tri-fill { fill: var(--accent-soft); stroke: var(--ink); stroke-width: 1.6 }
.phys-svg .lbl { font: 11px var(--f-mono); fill: var(--ink) } .phys-svg .cap { font: 10.5px var(--f-mono); fill: var(--muted) }
.phys-svg .pt-main { fill: var(--warm); stroke: var(--panel); stroke-width: 1.2 } .phys-svg .pt-aux { fill: var(--accent) } .phys-svg .pt-sim { fill: none; stroke: var(--neg); stroke-width: 1.6 }
.phys-svg .ln { stroke: var(--ink); stroke-width: 1 } .phys-svg .ln-faint { stroke: var(--muted); stroke-width: .6; opacity: .55 } .phys-svg .ln-dash { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3 }
.phys-svg .rod { stroke: var(--warm); stroke-width: 5; opacity: .55; stroke-linecap: round } .phys-svg .string { stroke: var(--accent); stroke-width: 1.6 }
.phys-svg .spring { fill: none; stroke: var(--accent); stroke-width: 1.2 } .phys-svg .mass { fill: var(--accent); opacity: .8 }
.phys-svg .cir, .phys-svg .cir-dash, .phys-svg .cir-faint { fill: none; stroke: var(--accent); stroke-width: 1 } .phys-svg .cir-dash { stroke-dasharray: 4 3 } .phys-svg .cir-faint { opacity: .35 }
.phys-svg .cir-fill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2 }
.phys-svg .path { fill: none; stroke: var(--accent); stroke-width: .7; opacity: .75 } .phys-svg .contour { fill: none; stroke: var(--accent); stroke-width: .7; opacity: .6 }
.phys-svg .ridge { stroke: var(--warm); stroke-width: 1.2 } .phys-svg .img-tri { fill: var(--warm-soft); stroke: var(--warm); stroke-width: 1; stroke-dasharray: 4 2 }
.phys-svg .inner { fill: var(--paper); stroke: var(--accent); stroke-width: 1 } .phys-svg .light { fill: none; stroke: var(--warm); stroke-width: 1.8 }
.phys-svg .glow { fill: var(--accent); opacity: .55 } .phys-svg .arr, .phys-svg .arr-cur { stroke: var(--warm); stroke-width: 1.6 } .phys-svg .arrh { fill: var(--warm) }
.phys-svg .leg { fill: var(--ink) } .phys-svg .chip { fill: var(--warm); opacity: .7 } .phys-svg .lamp { fill: var(--hi); stroke: var(--warm); stroke-width: 1.5 }
.phys-svg .wirein { fill: var(--panel); stroke: var(--ink); stroke-width: 1.2 } .phys-svg .wiredot { fill: var(--ink) }
.help { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 26px; margin-top: 16px }
@media (max-width: 860px) { .help { grid-template-columns: minmax(0, 1fr) } .help nav { display: none } }
.help nav a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none; font-size: .9rem } .help nav a:hover { color: var(--accent) }
.help article section { max-width: 75ch; margin-bottom: 28px } .help article p, .help article li { font-size: .95rem }
.measure-dict dt { font-weight: 600; margin-top: 14px } .measure-dict dd { margin: 4px 0 0 0; font-size: .92rem; max-width: 80ch }
.loading { color: var(--muted); font-style: italic }
.status { font-family: var(--f-mono); font-size: .8rem; color: var(--muted) }
.mono { font-family: var(--f-mono) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>
